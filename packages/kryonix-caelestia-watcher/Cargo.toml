[package]
name = "kryonix-caelestia-watcher"
version = "0.1.0"
edition = "2021"
description = "Resilient autosave watcher for Caelestia configuration"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
