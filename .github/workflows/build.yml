name: Kryonix Build & Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NIXPKGS_ALLOW_UNFREE: "1"

# ============================================================================
# Job 1: Valida o flake inteiro (avaliação + checks declarativos)
# ============================================================================
jobs:
  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: kryonix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: "(-source$|nixpkgs)"

      - name: Nix Flake Check
        run: nix flake check --keep-going --impure

# ============================================================================
# Job 2: Builda derivações pesadas e faz push para kryonix.cachix.org
# Matriz: packages do flake + toplevel do único host deste repo (iso).
#
# Os hosts glacier/inspiron NÃO vivem mais aqui — eles foram movidos para o
# downstream RAGton/Kryonixos (arquitetura dual-flake: este repo é o engine,
# o downstream importa via `inputs.kryonix`). Build/cache desses toplevels
# deve acontecer no CI do downstream, não aqui — senão `nix build` falha com
# "flake does not provide attribute nixosConfigurations.<host>".
# ============================================================================
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: flake-check
    strategy:
      fail-fast: false
      matrix:
        target:
          # Pacotes do flake (packages.x86_64-linux.*)
          - 'kryonix'
          - 'kryonix-home'
          - 'kryxd'
          - 'kryonix-hardware-probe'
          - 'kryonix-disk-planner'
          - 'kryonix-optimizer'
          # Toplevel da ISO (único host nixosConfigurations.* deste repo)
          - 'nixosConfigurations.iso.config.system.build.toplevel'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: kryonix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Exclui tarballs de source e o próprio nixpkgs (muito grande, já no cache público)
          pushFilter: "(-source$|-src$|nixpkgs)"

      - name: Build ${{ matrix.target }}
        run: |
          cachix watch-exec kryonix -- \
            nix build ".#${{ matrix.target }}" --impure --no-link -L
