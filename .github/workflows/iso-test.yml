name: Kryonix ISO Test

on:
  push:
    branches:
      - main
    paths:
      - 'hosts/iso/**'
      - 'flake.lock'
      - 'scripts/test-iso-boot.sh'
  pull_request:
    paths:
      - 'hosts/iso/**'
      - 'flake.lock'
      - 'scripts/test-iso-boot.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-iso:
    name: Build & Test ISO
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NIXPKGS_ALLOW_UNFREE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install QEMU & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf curl jq

      - uses: DeterminateSystems/nix-installer-action@v16
      
      - uses: cachix/cachix-action@v15
        with:
          name: kryonix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Setup Direnv
        run: |
          nix profile install nixpkgs#direnv
          direnv allow .

      - name: Flake Check (All Hosts & Modules)
        run: nix flake check --keep-going --impure

      - name: Build ISO
        run: nix build .#nixosConfigurations.iso.config.system.build.isoImage --out-link result-iso --impure

      - name: Run Boot Test
        run: |
          ISO_FILE=$(find result-iso/ -name "*.iso" | head -n 1)
          ./scripts/test-iso-boot.sh "$ISO_FILE" --ci

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Kryonix ISO Test failed! Check the logs for details."
