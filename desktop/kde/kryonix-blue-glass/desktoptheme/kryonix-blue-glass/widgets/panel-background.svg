      <rect x="4" y="4" width="52" height="52" rx="14" ry="14" fill="rgba(3, 10, 24, 0.65)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    </symbol>
  </defs>
  <g id="center"><use href="#tile"/></g>
