<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="eagleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="60%"  stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Águia: corpo + asas abertas estilizadas -->
  <g filter="url(#glow)" transform="translate(8,6)">
    <!-- Asa esquerda - superior -->
    <path d="M60,60 C45,45 20,35 5,25 C15,30 28,42 38,52 Z"
          fill="url(#eagleGrad)" opacity="0.95"/>
    <!-- Asa esquerda - inferior -->
    <path d="M60,60 C42,55 18,55 2,58 C14,56 30,58 42,62 Z"
          fill="url(#eagleGrad)" opacity="0.80"/>
    <!-- Asa esquerda - pena longa -->
    <path d="M60,60 C50,65 30,72 10,80 C22,72 38,68 50,65 Z"
          fill="url(#eagleGrad)" opacity="0.70"/>

    <!-- Asa direita - superior -->
    <path d="M60,60 C75,45 100,35 115,25 C105,30 92,42 82,52 Z"
          fill="url(#eagleGrad)" opacity="0.95"/>
    <!-- Asa direita - inferior -->
    <path d="M60,60 C78,55 102,55 118,58 C106,56 90,58 78,62 Z"
          fill="url(#eagleGrad)" opacity="0.80"/>
    <!-- Asa direita - pena longa -->
    <path d="M60,60 C70,65 90,72 110,80 C98,72 82,68 70,65 Z"
          fill="url(#eagleGrad)" opacity="0.70"/>

    <!-- Corpo central -->
    <ellipse cx="60" cy="60" rx="10" ry="18" fill="url(#eagleGrad)"/>

    <!-- Cabeça -->
    <circle cx="60" cy="38" r="11" fill="url(#eagleGrad)"/>
    <!-- Bico -->
    <path d="M60,44 L55,50 L65,48 Z" fill="#BAE6FD"/>
    <!-- Olho -->
    <circle cx="64" cy="36" r="2.5" fill="#0A1423"/>
    <circle cx="64.8" cy="35.2" r="0.8" fill="#38BDF8"/>

    <!-- Cauda -->
    <path d="M55,78 L60,92 L65,78 Z" fill="url(#eagleGrad)" opacity="0.9"/>
    <path d="M50,76 L55,93 L60,80 Z" fill="url(#eagleGrad)" opacity="0.7"/>
    <path d="M70,76 L65,93 L60,80 Z" fill="url(#eagleGrad)" opacity="0.7"/>

    <!-- Garras -->
    <path d="M54,92 L50,100 M54,92 L53,101 M54,92 L56,100"
          stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M66,92 L62,100 M66,92 L65,101 M66,92 L68,100"
          stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Linha divisória vertical sutil -->
  <line x1="145" y1="15" x2="145" y2="105"
        stroke="#38BDF8" stroke-width="0.8" opacity="0.35"/>

  <!-- Texto KRYONIX -->
  <text x="162" y="68"
        font-family="'Segoe UI', 'Liberation Sans', Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="6"
        fill="url(#textGrad)" filter="url(#glow)">KRYONIX</text>

  <!-- Subtexto -->
  <text x="164" y="88"
        font-family="'Segoe UI', 'Liberation Sans', Arial, sans-serif"
        font-size="11" font-weight="400" letter-spacing="8"
        fill="#38BDF8" opacity="0.65">NixOS Platform</text>
</svg>
