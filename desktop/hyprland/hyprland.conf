# =============================================================================
# Hyprland config — base (input, visual, layout, env)
# Autor: Gabriel Rocha (rag)
#
# Monitors → core/monitors.nix
# Window rules → core/rules.nix
# Keybinds → core/keybinds.nix
# =============================================================================

# =============================================================================
# Autostart — serviços de sessão
# Todos via `uwsm app --` para integração correta com UWSM + systemd-user.
# =============================================================================
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- nm-applet --indicator

# =============================================================================
# Input
# =============================================================================
input {
  kb_layout   = br
  kb_variant  = abnt2
  repeat_delay = 250
  repeat_rate  = 40
  follow_mouse = 1
  mouse_refocus = false
  sensitivity  = 0
  accel_profile = flat
  numlock_by_default = true

  touchpad {
    natural_scroll    = true
    disable_while_typing = true
    tap-to-click      = true
    scroll_factor     = 0.5
  }
}

# =============================================================================
# Geral
# =============================================================================
general {
  gaps_in   = 4
  gaps_out  = 8
  border_size = 2
  col.active_border   = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
  col.inactive_border = rgba(414868aa)
  layout = master
  resize_on_border = true
  allow_tearing    = false
}

# =============================================================================
# Decoração
# =============================================================================
decoration {
  rounding = 10

  blur {
    enabled  = true
    size     = 2
    passes   = 1
    noise    = 0.01
    contrast = 0.9
    brightness = 0.85
    popups   = true
  }

  shadow {
    enabled      = false
    range        = 8
    render_power = 3
    color        = rgba(1a1a2eee)
  }

  dim_inactive   = false
  dim_strength   = 0.0

  active_opacity   = 1.0
  inactive_opacity = 1.0
}

# =============================================================================
# Animações
# =============================================================================
animations {
  enabled = true

  bezier = snap,    0.05, 0.9, 0.1, 1.05
  bezier = smooth,  0.25, 0.1, 0.25, 1.0
  bezier = oversh,  0.34, 1.56, 0.64, 1.0

  animation = windows,    1, 4,  snap,   slide
  animation = windowsOut, 1, 3,  smooth, popin 80%
  animation = border,     1, 8,  smooth
  animation = fade,       1, 4,  smooth
  animation = workspaces, 1, 4,  smooth, slide
  animation = layers,     1, 3,  smooth, slide
}

# =============================================================================
# Layout
# =============================================================================
master {
  orientation = left
  mfact        = 0.55
  new_status   = slave
}

dwindle {
  preserve_split = true
}

# =============================================================================
# Misc
# =============================================================================
misc {
  force_default_wallpaper    = 0
  disable_hyprland_logo      = true
  disable_splash_rendering   = true
  vrr                        = 0
  mouse_move_enables_dpms    = true
  key_press_enables_dpms     = true
  focus_on_activate          = true
  animate_manual_resizes     = false
  enable_swallow             = true
  swallow_regex              = ^(tilix|com\.gexperts\.Tilix|alacritty|kitty|foot)$
}

# =============================================================================
# Gestos (touchpad)
# =============================================================================
gestures {
  workspace_swipe_distance     = 300
  workspace_swipe_cancel_ratio = 0.3
}

gesture = 3, horizontal, workspace

# =============================================================================
# Env vars exportadas para processos filhos
# =============================================================================
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1
