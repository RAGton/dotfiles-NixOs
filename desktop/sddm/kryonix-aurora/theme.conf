# =============================================================================
# theme.conf — Configuração do tema SDDM Kryonix Aurora
#
# Lido pelo SDDM e exposto ao Main.qml como `config.<chave>`. O QML usa Colors.js
# como fonte de verdade da paleta; estas chaves documentam os tokens e permitem
# trocar o fundo sem recompilar o QML.
# =============================================================================
[General]
# Fundo: SVG próprio do tema (renderizado por Image; requer plugin qtsvg).
background=assets/background.svg

# Paleta Kryonix Aurora (documentação / overrides futuros).
backgroundColor=#0B0F14
surfaceColor=#111827
surfaceAltColor=#1F2937
accentColor=#38BDF8
accentStrongColor=#0EA5E9
textColor=#E5E7EB
mutedColor=#94A3B8
borderColor=#1E3A5F

# Mostrar dica de layout de teclado / Caps Lock.
showKeyboardHints=true
