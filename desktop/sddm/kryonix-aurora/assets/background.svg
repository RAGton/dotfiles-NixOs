<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="0.55" stop-color="#0A0E13"/>
      <stop offset="1" stop-color="#080B10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.82" r="0.55">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>

  <!-- curvas "aurora" sutis -->
  <g fill="none" stroke="#38BDF8" stroke-linecap="round">
    <path d="M-120 320 C 380 210 720 540 1120 370 C 1520 200 1820 430 2120 310"
          stroke-opacity="0.10" stroke-width="2.5"/>
    <path d="M-120 450 C 380 340 720 670 1120 500 C 1520 330 1820 560 2120 440"
          stroke-opacity="0.06" stroke-width="2"/>
    <path d="M-120 200 C 420 120 760 420 1180 250 C 1560 95 1860 330 2120 210"
          stroke-opacity="0.05" stroke-width="1.5"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
